services:
  web:
    build: .
    container_name: sistemabet-web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      # 8000 e 8001 ja usadas por outros projetos nesta maquina
      - "8010:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: sistemabet-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sistemabet}
      POSTGRES_USER: ${POSTGRES_USER:-sistemabet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sistemabet}
    ports:
      # 5432-5435 ja usadas por outros projetos nesta maquina
      - "5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sistemabet}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
