{% extends "base.html" %}
{% block titulo %}E-mail confirmado{% endblock %}

{% block conteudo %}
  <div class="mx-auto max-w-lg rounded-2xl border border-fundo-borda bg-fundo-card p-8 text-center">
    <h1 class="text-xl font-bold">E-mail confirmado</h1>

    <p class="mt-3 text-sm text-white/50">
      Pronto. Seu e-mail está confirmado e este link não vale mais.
    </p>

    {% if user.is_authenticated %}
      <a href="{% url 'contas:perfil' %}" class="btn-marca mt-6">Minha conta</a>
    {% else %}
      <a href="{% url 'contas:login' %}" class="btn-marca mt-6">Entrar</a>
    {% endif %}
  </div>
{% endblock %}
