{% extends "base.html" %}
{% block titulo %}Senha alterada{% endblock %}

{% block conteudo %}
  <div class="mx-auto max-w-lg rounded-2xl border border-borda bg-fundo-card p-8 text-center">
    <span class="mx-auto grid h-12 w-12 place-items-center rounded-full bg-sucesso-fundo text-sucesso">
      {% include "_componentes/icone.html" with nome="sucesso" classe="h-6 w-6" %}
    </span>
    <h1 class="mt-4 text-xl font-semibold text-texto">Senha alterada</h1>
    <p class="mt-3 text-sm text-texto-2">
      Sua senha foi redefinida. Você já pode entrar com a nova senha.
    </p>
    <a href="{% url 'contas:login' %}" class="btn-marca btn-lg mt-6">Entrar</a>
  </div>
{% endblock %}
