name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seguranca:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Repositorio publico: um segredo commitado e vazamento permanente.
      # Varredura do historico completo. Nao usamos a action oficial porque ela
      # compara intervalos de commit e falha no primeiro push, quando o commit
      # inicial nao tem pai.
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --redact --no-banner --exit-code 1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  testes:
    name: Testes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sistemabet
          POSTGRES_USER: sistemabet
          POSTGRES_PASSWORD: sistemabet
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      POSTGRES_HOST: localhost
      POSTGRES_DB: sistemabet
      POSTGRES_USER: sistemabet
      POSTGRES_PASSWORD: sistemabet
      DEBUG: "0"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Gerar SECRET_KEY efemera
        run: |
          echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(64))')" >> "$GITHUB_ENV"
      - name: Checagem de deploy do Django
        run: python manage.py check --deploy --settings=config.settings.prod
        env:
          ALLOWED_HOSTS: exemplo.com
          # prod.py exige SMTP configurado; valores de fachada so para a checagem
          EMAIL_HOST: smtp.exemplo.com
          EMAIL_HOST_USER: ci
          EMAIL_HOST_PASSWORD: ci
      - run: pytest
